<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shivratri Blessings for Pratiksha</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e3a8a, #ffffff, #b76e79);
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}
h1 {
    font-size: 42px;
    margin: 20px;
    color: #b76e79;
    text-shadow: 1px 1px 8px white;
}
#blessing {
    font-size: 24px;
    max-width: 600px;
    min-height: 50px;
    text-shadow: 1px 1px 6px #b76e79;
    margin: 20px auto;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    background-color: #b76e79;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 20px;
    transition: 0.3s;
}
button:hover {
    background-color: white;
    color: #b76e79;
    box-shadow: 0 0 12px #b76e79;
}
#moon {
    position: absolute;
    top: 10%;
    right: 10%;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc 70%);
    box-shadow: 0 0 60px 15px rgba(255,255,255,0.5);
}
canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
}
</style>
</head>
<body>

<div id="moon"></div>
<h1>🌙 Shivratri Blessings for Pratiksha</h1>
<div id="blessing">Click the button to receive your blessing ✨</div>
<button onclick="generateBlessing()">Reveal Blessing</button>

<canvas id="starCanvas"></canvas>

<script>
// ===== Canvas setup =====
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== Letters pixel maps =====
// Each letter is a 5x5 grid (1=star, 0=empty)
const letters = {
    "I": ["111","010","010","010","111"],
    "L": ["100","100","100","100","111"],
    "O": ["111","101","101","101","111"],
    "V": ["101","101","101","101","010"],
    "E": ["111","100","111","100","111"],
    "Y": ["101","101","010","010","010"],
    "U": ["101","101","101","101","111"],
    " ": ["000","000","000","000","000"] // space
};

// Word to display
const word = "I LOVE YOU";

// Parameters
const pixelSize = 15;
let startX = canvas.width/2 - (word.length*pixelSize*5)/2;
const startY = canvas.height/2 - 50;
let starPositions = [];

// Generate positions for all letters
for(let w=0; w<word.length; w++){
    let letter = word[w];
    let map = letters[letter] || letters[" "];
    for(let row=0; row<map.length; row++){
        for(let col=0; col<map[row].length; col++){
            if(map[row][col]=="1"){
                starPositions.push({
                    x: startX + w*pixelSize*6 + col*pixelSize + Math.random()*2,
                    y: startY + row*pixelSize + Math.random()*2
                });
            }
        }
    }
}

// ===== Stars =====
const stars = [];
for(let i=0; i<starPositions.length; i++){
    stars.push({
        x: starPositions[i].x,
        y: starPositions[i].y,
        radius: Math.random()*1.5 + 1,
        twinkle: Math.random()*0.05
    });
}

// ===== Animation =====
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    stars.forEach(s => {
        // twinkle effect
        s.radius += s.twinkle;
        if(s.radius>2.5 || s.radius<1) s.twinkle *= -1;
        
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
        ctx.fillStyle = "white";
        ctx.fill();
    });
    
    requestAnimationFrame(animate);
}
animate();

// ===== Personalized blessings =====
let blessings = [
    "Pratiksha, may Lord Shiva bless you with happiness, courage, and endless inspiration.",
    "May this Shivratri bring peace, prosperity, and divine light to Pratiksha's life.",
    "Pratiksha, may the grace of Shivji guide you and fill your heart with joy.",
    "On this auspicious night, Pratiksha, may you feel the serenity and strength of the divine moon.",
    "Pratiksha, may Lord Shiva protect you from all obstacles and shower you with blessings.",
    "May the divine vibration of Mahadev tonight bring endless positivity to Pratiksha’s world."
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}
blessings = shuffle(blessings);
let used = [];

function typeWriter(text,i=0){
    if(i<text.length){
        document.getElementById("blessing").innerHTML += text.charAt(i);
        setTimeout(()=>typeWriter(text,i+1),30);
    }
}

function generateBlessing(){
    if(blessings.length === 0){
        blessings = shuffle(used);
        used = [];
    }
    const message = blessings.shift();
    used.push(message);
    document.getElementById("blessing").innerHTML = "";
    typeWriter(message);
}
</script>

</body>
</html>
