<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shivratri Blessings for Pratiksha</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e3a8a, #ffffff, #b76e79);
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
h1 {
    font-size: 42px;
    margin-bottom: 20px;
    color: #b76e79;
    text-shadow: 1px 1px 8px white;
}
#blessing {
    font-size: 24px;
    max-width: 600px;
    min-height: 50px;
    text-shadow: 1px 1px 6px #b76e79;
    margin-top: 20px;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    background-color: #b76e79;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
}
button:hover {
    background-color: white;
    color: #b76e79;
    box-shadow: 0 0 12px #b76e79;
}
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
}
.letterStar {
    width: 5px;
    height: 5px;
    background: #b76e79;
    box-shadow: 0 0 8px #b76e79;
    border-radius: 50%;
    position: absolute;
}
#moon {
    position: absolute;
    top: 10%;
    right: 10%;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc 70%);
    box-shadow: 0 0 60px 15px rgba(255,255,255,0.5);
}
</style>
</head>
<body>

<div id="moon"></div>
<h1>🌙 Shivratri Blessings for Pratiksha</h1>
<div id="blessing">Click the button to receive your blessing ✨</div>
<button onclick="generateBlessing()">Reveal Blessing</button>

<script>
// ===== Floating random stars =====
const stars = [];
for(let i=0;i<100;i++){
    const star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random()*window.innerHeight + "px";
    star.style.left = Math.random()*window.innerWidth + "px";
    star.speedX = (Math.random()-0.5)*0.5;
    star.speedY = (Math.random()-0.5)*0.5;
    document.body.appendChild(star);
    stars.push(star);
}

function moveStars(){
    stars.forEach(s => {
        let x = parseFloat(s.style.left);
        let y = parseFloat(s.style.top);
        x += s.speedX;
        y += s.speedY;
        if(x<0) x=window.innerWidth;
        if(x>window.innerWidth) x=0;
        if(y<0) y=window.innerHeight;
        if(y>window.innerHeight) y=0;
        s.style.left = x + "px";
        s.style.top = y + "px";
    });
    requestAnimationFrame(moveStars);
}
moveStars();

// ===== Draw letter P using stars =====
const letterP = [
  "1110",
  "1001",
  "1110",
  "1000",
  "1000"
];

const startX = window.innerWidth/2 - 30; // center horizontally
const startY = window.innerHeight/2 - 50; // center vertically
const pixelSize = 15;

for(let row=0; row<letterP.length; row++){
    for(let col=0; col<letterP[row].length; col++){
        if(letterP[row][col]=="1"){
            let star = document.createElement("div");
            star.className = "letterStar";
            star.style.left = (startX + col*pixelSize) + "px";
            star.style.top = (startY + row*pixelSize) + "px";
            document.body.appendChild(star);
        }
    }
}

// ===== Personalized blessings =====
let blessings = [
    "Pratiksha, may Lord Shiva bless you with happiness, courage, and endless inspiration.",
    "May this Shivratri bring peace, prosperity, and divine light to Pratiksha's life.",
    "Pratiksha, may the grace of Shivji guide you and fill your heart with joy.",
    "On this auspicious night, Pratiksha, may you feel the serenity and strength of the divine moon.",
    "Pratiksha, may Lord Shiva protect you from all obstacles and shower you with blessings.",
    "May the divine vibration of Mahadev tonight bring endless positivity to Pratiksha’s world."
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}
blessings = shuffle(blessings);
let used = [];

function typeWriter(text,i=0){
    if(i<text.length){
        document.getElementById("blessing").innerHTML += text.charAt(i);
        setTimeout(()=>typeWriter(text,i+1),30);
    }
}

function generateBlessing(){
    if(blessings.length === 0){
        blessings = shuffle(used);
        used = [];
    }
    const message = blessings.shift();
    used.push(message);
    document.getElementById("blessing").innerHTML = "";
    typeWriter(message);
}
</script>

</body>
</html>
