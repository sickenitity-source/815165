<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shivratri Blessings for Pratiksha</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e3a8a, #ffffff, #b76e79);
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}
h1 {
    font-size: 42px;
    margin: 20px;
    color: #b76e79;
    text-shadow: 1px 1px 8px white;
}
#blessing {
    font-size: 24px;
    max-width: 600px;
    min-height: 50px;
    text-shadow: 1px 1px 6px #b76e79;
    margin: 20px auto;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    background-color: #b76e79;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 20px;
    transition: 0.3s;
}
button:hover {
    background-color: white;
    color: #b76e79;
    box-shadow: 0 0 12px #b76e79;
}
#moon {
    position: absolute;
    top: 10%;
    right: 10%;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc 70%);
    box-shadow: 0 0 60px 15px rgba(255,255,255,0.5);
}
canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
}
</style>
</head>
<body>

<div id="moon"></div>
<h1>🌙 Shivratri Blessings for Pratiksha</h1>
<div id="blessing">Click the button to receive your blessing ✨</div>
<button onclick="generateBlessing()">Reveal Blessing</button>

<canvas id="starCanvas"></canvas>

<script>
// ===== Canvas setup =====
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== Letter P pixel map =====
const letterP = [
  "1110",
  "1001",
  "1110",
  "1000",
  "1000"
];
const pixelSize = 20;
const startX = canvas.width/2 - 40;
const startY = canvas.height/2 - 50;
let targetPositions = [];

// generate target positions for P
for(let row=0; row<letterP.length; row++){
    for(let col=0; col<letterP[row].length; col++){
        if(letterP[row][col] == "1"){
            targetPositions.push({
                x: startX + col*pixelSize + Math.random()*5,
                y: startY + row*pixelSize + Math.random()*5
            });
        }
    }
}

// ===== Stars =====
const stars = [];
const totalStars = 150;
for(let i=0; i<totalStars; i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        dx: (Math.random()-0.5)*1.2,
        dy: (Math.random()-0.5)*1.2,
        target: i<targetPositions.length ? targetPositions[i] : null
    });
}

// ===== Animation =====
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    stars.forEach(s => {
        // move slightly towards target if exists
        if(s.target){
            let tx = s.target.x - s.x;
            let ty = s.target.y - s.y;
            s.x += tx*0.03 + (Math.random()-0.5)*0.5;
            s.y += ty*0.03 + (Math.random()-0.5)*0.5;
        } else {
            // random float
            s.x += s.dx;
            s.y += s.dy;
        }
        // wrap around
        if(s.x<0) s.x = canvas.width;
        if(s.x>canvas.width) s.x = 0;
        if(s.y<0) s.y = canvas.height;
        if(s.y>canvas.height) s.y = 0;

        // draw star
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2, 0, Math.PI*2);
        ctx.fillStyle = "white";
        ctx.fill();
    });
    
    requestAnimationFrame(animate);
}
animate();

// ===== Personalized blessings =====
let blessings = [
    "Pratiksha, may Lord Shiva bless you with happiness, courage, and endless inspiration.",
    "May this Shivratri bring peace, prosperity, and divine light to Pratiksha's life.",
    "Pratiksha, may the grace of Shivji guide you and fill your heart with joy.",
    "On this auspicious night, Pratiksha, may you feel the serenity and strength of the divine moon.",
    "Pratiksha, may Lord Shiva protect you from all obstacles and shower you with blessings.",
    "May the divine vibration of Mahadev tonight bring endless positivity to Pratiksha’s world."
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}
blessings = shuffle(blessings);
let used = [];

function typeWriter(text,i=0){
    if(i<text.length){
        document.getElementById("blessing").innerHTML += text.charAt(i);
        setTimeout(()=>typeWriter(text,i+1),30);
    }
}

function generateBlessing(){
    if(blessings.length === 0){
        blessings = shuffle(used);
        used = [];
    }
    const message = blessings.shift();
    used.push(message);
    document.getElementById("blessing").innerHTML = "";
    typeWriter(message);
}
</script>

</body>
</html>
